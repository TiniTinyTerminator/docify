[package]
name        = "doccy"
version     = "0.1.0"
edition     = "2021"
license     = "Apache-2.0"
description = "Multi-language doc comment extractor — C/C++, Fortran, Rust, D, Ada, Java, Go"
repository  = "https://github.com/freight-lang/doccy"
keywords    = ["documentation", "extractor", "doxygen", "javadoc", "godoc"]
categories  = ["development-tools", "text-processing"]

[lib]
name = "doccy"
path = "src/lib.rs"

[[bin]]
name = "doccy"
path = "src/main.rs"

[features]
default   = []
clang     = ["dep:clang"]
rich-math = []

[dependencies]
walkdir        = "2"
pulldown-cmark = "0.12"
clap           = { version = "4", features = ["derive"] }
serde          = { version = "1", features = ["derive"] }
serde_json     = "1"
clang          = { version = "2", optional = true, features = ["runtime"] }
